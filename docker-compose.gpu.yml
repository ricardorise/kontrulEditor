# Override de GPU. Requer o nvidia-container-toolkit no host. `make up` aplica sozinho quando detecta o runtime nvidia.
services:
  worker-asr:
    environment:
      KONTRUL_WHISPER_MODEL: ${KONTRUL_WHISPER_MODEL_GPU:-large-v3}
      KONTRUL_ASR_DEVICE: cuda            # sem GPU visível o job falha com erro claro, em vez de cair em CPU em silêncio
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
